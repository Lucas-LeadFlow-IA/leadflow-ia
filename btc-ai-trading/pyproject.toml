[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-ai-trading"
version = "0.1.0"
description = "Multi-agent BTC perpetuals trading system for Hyperliquid (paper / testnet / live)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyperliquid-python-sdk==0.24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "websockets>=13",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = [
    "agents*", "analysis*", "backtesting*", "config*", "core*", "dashboard*",
    "database*", "execution*", "machine_learning*", "market_data*", "monitoring*",
    "risk*", "strategies*", "telegram*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that call the real Hyperliquid read-only API (deselect with -m 'not network')",
]
filterwarnings = ["ignore::DeprecationWarning"]
